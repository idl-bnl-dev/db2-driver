name: Live DB2 Tests

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Never run two live suites at once against the shared database.
concurrency:
  group: live-db2
  cancel-in-progress: false

jobs:
  live:
    name: Live DB2 (PHP 8.5)
    runs-on: ubuntu-latest
    # Secrets are not exposed to PRs from forks, so skip those.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    env:
      DB_HOST: ${{ secrets.DB_HOST }}
      DB_PORT: ${{ secrets.DB_PORT }}
      DB_DATABASE: ${{ secrets.DB_DATABASE }}
      DB_SCHEMA: ${{ secrets.DB_SCHEMA }}
      DB_USERNAME: ${{ secrets.DB_USERNAME }}
      DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install IBM i Access ODBC driver
        run: |
          sudo apt-get update
          sudo apt-get install -y unixodbc unixodbc-dev curl gpg
          curl -fsSL --retry 5 --retry-all-errors https://public.dhe.ibm.com/software/ibmi/products/odbc/debs/dists/1.1.0/ibmi-acs-1.1.0.list \
            | sudo tee /etc/apt/sources.list.d/ibmi-acs-1.1.0.list

          # IBM's server is occasionally unreachable from hosted runners, and apt
          # then silently skips the repo. Retry until the package is installable.
          for attempt in 1 2 3 4 5; do
            sudo apt-get update -o Acquire::Retries=5 || true
            if sudo apt-get install -y -o Acquire::Retries=5 ibm-iaccess; then
              break
            fi
            if [ "$attempt" = 5 ]; then
              echo "::error::Could not install ibm-iaccess from IBM's repository after 5 attempts"
              exit 1
            fi
            echo "Attempt $attempt failed, retrying in $((attempt * 15))s..."
            sleep $((attempt * 15))
          done

          odbcinst -q -d

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: pdo, pdo_odbc
          coverage: none

      - name: Install dependencies
        run: composer update --prefer-dist --no-interaction --no-progress

      - name: Run live tests
        run: composer test-live
